enum Difficulty {
  A1
  A2
  B1
  B2
  C1
  C2
}

type Query {
  sessionDifficulties: [Difficulty!]!
  activeSession(userId: Int!): ActiveSession
  sessionScore(sessionId: Int!): Int!
  studentProgress(userId: Int!): StudentProgress!
}

type Mutation {
  createSession(input: CreateSessionInput!): Session!
  endSession(sessionId: Int!): Boolean!
  guessWord(sessionId: Int!, guess: String!): GuessResult!
}

input CreateSessionInput {
  userId: Int!
  durationMinutes: Int!
  difficulty: Difficulty!
}

type Session {
  id: Int!
  userId: Int!
  createdAt: String!
  endsAt: String!
  difficulty: Difficulty!
}

type ActiveSession {
  id: Int!
  userId: Int!
  createdAt: String!
  endsAt: String!
  difficulty: Difficulty!
  remainingSeconds: Int!
  currentWord: Word
}

type Word {
  term: String!
  definition: String!
  example: String!
  difficulty: Difficulty!
}

type DifficultyScore {
  difficulty: Difficulty!
  score: Int!
}

type WordStat {
  term: String!
  count: Int!
}

type StudentProgress {
  difficultyScores: [DifficultyScore!]!
  topCorrectWords: [WordStat!]!
  topIncorrectWords: [WordStat!]!
}

type GuessResult {
  correct: Boolean!
  term: String!
}
